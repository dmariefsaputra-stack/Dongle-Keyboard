<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family="Arial, Helvetica, sans-serif">
  <rect width="760" height="380" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">DONG-KEY wiring</text>

  <!-- USB plug -->
  <rect x="30" y="160" width="70" height="60" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="65" y="195" text-anchor="middle" font-size="14" fill="#1e293b">USB</text>
  <line x1="100" y1="190" x2="180" y2="190" stroke="#475569" stroke-width="3"/>
  <text x="140" y="180" text-anchor="middle" font-size="11" fill="#475569">to PC</text>

  <!-- Chip -->
  <rect x="180" y="80" width="230" height="230" rx="10" fill="#1e293b"/>
  <text x="295" y="185" text-anchor="middle" font-size="22" font-weight="bold" fill="#f8fafc">CH552</text>
  <text x="295" y="210" text-anchor="middle" font-size="12" fill="#94a3b8">board</text>

  <!-- Pins -->
  <g font-size="14" font-weight="bold">
    <rect x="400" y="110" width="20" height="14" fill="#cbd5e1"/>
    <text x="390" y="122" text-anchor="end" fill="#f8fafc">P3.0</text>
    <rect x="400" y="175" width="20" height="14" fill="#cbd5e1"/>
    <text x="390" y="187" text-anchor="end" fill="#f8fafc">P3.2</text>
    <rect x="400" y="240" width="20" height="14" fill="#cbd5e1"/>
    <text x="390" y="252" text-anchor="end" fill="#f8fafc">P1.5</text>
  </g>

  <!-- LED on P3.0 -->
  <line x1="420" y1="117" x2="560" y2="117" stroke="#475569" stroke-width="2"/>
  <circle cx="575" cy="117" r="14" fill="#38bdf8" stroke="#0369a1" stroke-width="2"/>
  <text x="600" y="113" font-size="14" fill="#1e293b">Status LED</text>
  <text x="600" y="130" font-size="11" fill="#64748b">(on board)</text>

  <!-- Switch between P3.2 and P1.5 -->
  <line x1="420" y1="182" x2="520" y2="182" stroke="#475569" stroke-width="2"/>
  <line x1="420" y1="247" x2="520" y2="247" stroke="#475569" stroke-width="2"/>
  <line x1="520" y1="182" x2="520" y2="195" stroke="#475569" stroke-width="2"/>
  <line x1="520" y1="247" x2="520" y2="234" stroke="#475569" stroke-width="2"/>
  <circle cx="520" cy="198" r="4" fill="#475569"/>
  <circle cx="520" cy="231" r="4" fill="#475569"/>
  <line x1="520" y1="231" x2="508" y2="200" stroke="#475569" stroke-width="2"/>
  <line x1="496" y1="214" x2="510" y2="214" stroke="#475569" stroke-width="2"/>
  <line x1="496" y1="206" x2="496" y2="222" stroke="#475569" stroke-width="3"/>
  <text x="540" y="210" font-size="14" fill="#1e293b">Button / switch</text>
  <text x="540" y="228" font-size="11" fill="#64748b">P1.5 is driven LOW by the firmware,</text>
  <text x="540" y="243" font-size="11" fill="#64748b">so it acts as GND for P3.2</text>

  <!-- Notes -->
  <rect x="30" y="325" width="700" height="40" rx="6" fill="#fef2f2" stroke="#f87171"/>
  <text x="45" y="350" font-size="13" fill="#991b1b">Do NOT connect the switch to P3.0: it drives the LED and would short against P1.5.</text>
</svg>
